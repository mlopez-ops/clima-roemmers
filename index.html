<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Clima Buenos Aires</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; font-family:'Barlow',sans-serif; background:linear-gradient(180deg,#081c34 0%,#16446f 45%,#6da4d0 100%); }

.sky-bg { position:fixed; inset:0; z-index:0; overflow:hidden; }
.cloud { position:absolute; background:rgba(240,248,255,0.12); border-radius:50px; }
.cloud::before,.cloud::after { content:''; position:absolute; background:rgba(240,248,255,0.12); border-radius:50%; }
.c1{width:400px;height:90px;top:80px;left:-450px;animation:mc 50s linear infinite;}
.c1::before{width:200px;height:160px;top:-90px;left:80px;}
.c1::after{width:160px;height:120px;top:-70px;left:200px;}
.c2{width:300px;height:70px;top:160px;left:-350px;animation:mc 65s linear infinite 15s;opacity:.7;}
.c2::before{width:150px;height:120px;top:-65px;left:55px;}
.c2::after{width:120px;height:95px;top:-52px;left:145px;}
.c3{width:500px;height:100px;top:40px;left:-550px;animation:mc 55s linear infinite 28s;opacity:.5;}
.c3::before{width:240px;height:190px;top:-105px;left:100px;}
.c3::after{width:190px;height:150px;top:-85px;left:250px;}
@keyframes mc{from{left:-600px}to{left:2000px}}

.snowflake{position:fixed;z-index:1;color:rgba(255,255,255,.85);font-size:22px;opacity:0;animation:snowfall linear infinite;user-select:none;}
@keyframes snowfall{0%{transform:translateY(-50px) translateX(0);opacity:0}10%{opacity:.8}100%{transform:translateY(1150px) translateX(80px);opacity:0}}
.snowflake:nth-of-type(1){left:5%;animation-duration:12s}.snowflake:nth-of-type(2){left:15%;animation-duration:15s}.snowflake:nth-of-type(3){left:28%;animation-duration:10s}
.snowflake:nth-of-type(4){left:42%;animation-duration:14s}.snowflake:nth-of-type(5){left:58%;animation-duration:13s}.snowflake:nth-of-type(6){left:70%;animation-duration:16s}
.snowflake:nth-of-type(7){left:82%;animation-duration:11s}.snowflake:nth-of-type(8){left:92%;animation-duration:14s}.snowflake:nth-of-type(9){left:22%;animation-duration:12s}
.snowflake:nth-of-type(10){left:65%;animation-duration:15s}.snowflake:nth-of-type(11){left:48%;animation-duration:10s}.snowflake:nth-of-type(12){left:78%;animation-duration:14s}


.page { position:relative; z-index:10; width:1920px; height:1080px; display:flex; flex-direction:column; }

.banner {
    width: 1920px;
    height: 180px;
    flex-shrink: 0;
    overflow: hidden;
}

.banner img {
    width: 1920px;
    height: auto;
    display: block;
}

.clima-body { flex:1; display:flex; align-items:center; justify-content:center; padding:20px 80px 60px; gap:40px; }

.card { flex:1; height:740px; border-radius:24px; background:rgba(170,210,255,.12); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,.18); box-shadow:0 8px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.15); display:flex; flex-direction:column; padding:28px 44px 24px; position:relative; overflow:hidden; }
.card.today { flex:1.4; background:rgba(120,190,255,.18); }
.card::after { content:''; position:absolute; inset:0; border-radius:24px; border:1px solid rgba(255,255,255,0.12); pointer-events:none; }

.card-fecha { margin-bottom:16px; }
.card-dia-nombre { font-size:38px; font-weight:800; color:#fff; }
.card-dia-nombre span { font-weight:400; color:rgba(255,255,255,0.7); margin-left:10px; }
.card.today .card-dia-nombre { font-size:48px; }

.card-icon { flex:1; display:flex; align-items:center; justify-content:center; max-height:220px; }
.card-icon svg { filter:drop-shadow(0 8px 24px rgba(0,0,0,0.4)); }
.card.today .card-icon svg { transform:scale(1.2); }

.card-divider { height:1px; background:rgba(255,255,255,0.2); margin:10px 0; }

.card-temps { display:flex; align-items:baseline; gap:24px; margin-bottom:8px; }
.card-max { font-size:52px; font-weight:800; color:#fff; }
.card-min { font-size:52px; font-weight:400; color:rgba(255,255,255,0.6); }

.card-actual { font-size:100px; font-weight:800; color:#fff; line-height:1; margin-bottom:4px; }
.card-actual sup { font-size:46px; font-weight:400; vertical-align:super; }
.card-maxmin-small { font-size:34px; color:rgba(255,255,255,0.75); font-weight:600; margin-bottom:12px; }

.card-extra { font-size:23px; color:rgba(255,255,255,0.65); line-height:1.55; }
.card-extra strong { color:rgba(255,255,255,0.9); font-weight:600; }

.card-lluvia { position:absolute; bottom:32px; right:36px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.card-lluvia-pct { font-size:22px; font-weight:700; color:rgba(255,255,255,0.7); }

/* Estilo iPhone para tarjeta de hoy */
.today-temp-big { font-size:130px; font-weight:200; color:#fff; line-height:1; text-align:center; letter-spacing:-4px; text-shadow:0 0 18px rgba(190,230,255,.45),0 0 30px rgba(190,230,255,.20); }
.today-temp-big sup { font-size:56px; font-weight:200; vertical-align:super; letter-spacing:0; }
.today-desc-iphone { font-size:36px; font-weight:400; color:rgba(255,255,255,0.9); text-align:center; margin-top:8px; }
.today-maxmin-iphone { font-size:34px; font-weight:400; color:rgba(255,255,255,0.85); text-align:center; margin-top:6px; }
.today-extra { font-size:22px; color:rgba(255,255,255,0.6); line-height:1.55; margin-top:10px; }
.today-extra strong { color:rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="sky-bg">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
</div>
<div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div><div class="snowflake">❄</div>

<div class="page">
 <div class="banner">
    <img src="Sertal_NvaCarrera_970x90.gif" alt="Banner">
</div>
  <div class="clima-body" id="clima-body">
    <div style="color:rgba(255,255,255,0.7);font-size:36px;">Cargando clima...</div>
  </div>
</div>

<script>
const API_KEY = '5f445914cf174b698ad134733262605';
const CIUDAD_Q = 'Buenos Aires';
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const GOTA = `<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 2 C14 2 2 16 2 24 a12 12 0 0 0 24 0 C26 16 14 2 14 2z" fill="#5ab0e8" opacity="0.85"/><ellipse cx="10" cy="20" rx="3" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(-20,10,20)"/></svg>`;

function getIcon(condCode, isDay, size) {
  const s = size || 220;
  const day = isDay !== 0;
  // Soleado / despejado
  if ([1000].includes(condCode)) {
    if (!day) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="ng"><stop offset="0%" stop-color="#fff7a0"/><stop offset="40%" stop-color="#a0b8ff"/><stop offset="100%" stop-color="#6080d0"/></radialGradient></defs><circle cx="100" cy="100" r="48" fill="url(#ng)"/><circle cx="130" cy="75" r="38" fill="#1a3060"/>${Array.from({length:8},(_,i)=>{const x=100+90*Math.cos((i/8)*Math.PI*2),y=100+90*Math.sin((i/8)*Math.PI*2);return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="2" fill="rgba(200,220,255,0.8)"/>`;}).join('')}</svg>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="sg"><stop offset="0%" stop-color="#fff7a0"/><stop offset="40%" stop-color="#ffd700"/><stop offset="100%" stop-color="#ff8c00"/></radialGradient><radialGradient id="glow"><stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffd700" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="100" r="75" fill="url(#glow)"/>${Array.from({length:16},(_,i)=>{const a=(i/16)*360;const r1=58,r2=i%2===0?78:70;const x1=100+r1*Math.cos(a*Math.PI/180),y1=100+r1*Math.sin(a*Math.PI/180),x2=100+r2*Math.cos(a*Math.PI/180),y2=100+r2*Math.sin(a*Math.PI/180);return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#ffd700" stroke-width="${i%2===0?4:2.5}" stroke-linecap="round" opacity="0.9"/>`;}).join('')}<circle cx="100" cy="100" r="48" fill="url(#sg)"/><circle cx="84" cy="88" r="10" fill="rgba(255,255,255,0.25)"/></svg>`;
  }
  // Parcialmente nublado
  if ([1003].includes(condCode)) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="sg2"><stop offset="0%" stop-color="#fff7a0"/><stop offset="40%" stop-color="#ffd700"/><stop offset="100%" stop-color="#ff8c00"/></radialGradient><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f4ff"/><stop offset="100%" stop-color="#c8dff5"/></linearGradient></defs>${Array.from({length:12},(_,i)=>{const a=(i/12)*360;const r1=42,r2=i%2===0?58:52;const x1=72+r1*Math.cos(a*Math.PI/180),y1=72+r1*Math.sin(a*Math.PI/180),x2=72+r2*Math.cos(a*Math.PI/180),y2=72+r2*Math.sin(a*Math.PI/180);return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity="0.8"/>`;}).join('')}<circle cx="72" cy="72" r="36" fill="url(#sg2)"/><ellipse cx="110" cy="148" rx="60" ry="28" fill="url(#cg)" opacity="0.95"/><circle cx="82" cy="138" r="34" fill="url(#cg)"/><circle cx="116" cy="130" r="40" fill="url(#cg)"/><circle cx="148" cy="140" r="28" fill="url(#cg)"/></svg>`;
  // Nublado
  if ([1006,1009].includes(condCode)) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d0e8f8"/><stop offset="100%" stop-color="#a0c4e8"/></linearGradient></defs><ellipse cx="100" cy="130" rx="75" ry="32" fill="url(#cg3)" opacity="0.9"/><circle cx="65" cy="118" r="42" fill="url(#cg3)"/><circle cx="105" cy="108" r="50" fill="url(#cg3)"/><circle cx="145" cy="120" r="36" fill="url(#cg3)"/></svg>`;
  // Niebla
  if ([1030,1135,1147].includes(condCode)) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="fgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c8d8e8"/><stop offset="100%" stop-color="#90a8b8"/></linearGradient></defs>
    <ellipse cx="100" cy="90" rx="72" ry="28" fill="url(#fgg)" opacity="0.8"/>
    <circle cx="65" cy="80" r="38" fill="url(#fgg)"/>
    <circle cx="105" cy="70" r="45" fill="url(#fgg)"/>
    <circle cx="143" cy="82" r="32" fill="url(#fgg)"/>
    <rect x="25" y="118" width="150" height="10" rx="5" fill="rgba(180,200,220,0.7)"/>
    <rect x="15" y="136" width="170" height="10" rx="5" fill="rgba(180,200,220,0.6)"/>
    <rect x="35" y="154" width="130" height="10" rx="5" fill="rgba(180,200,220,0.5)"/>
    <text x="100" y="192" font-size="22" font-weight="700" fill="rgba(255,255,255,0.9)" text-anchor="middle" font-family="Barlow,sans-serif" letter-spacing="3">NIEBLA</text>
  </svg>`;
  // Lluvia / llovizna
  if ([1063,1150,1153,1168,1171,1180,1183,1186,1189,1192,1195,1198,1201,1240,1243,1246].includes(condCode)) {
    const heavy = [1192,1195,1201,1246].includes(condCode);
    const drops = heavy ? 9 : 6;
    const dsvg = Array.from({length:drops},(_,i)=>{const x=40+i*(120/(drops-1)),y=155+((i%3)*14);return `<ellipse cx="${x}" cy="${y}" rx="3.5" ry="9" fill="#7ec8f0" opacity="0.85" transform="rotate(-15,${x},${y})"/>`;}).join('');
    return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="rcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8aaac8"/><stop offset="100%" stop-color="#5a7a9a"/></linearGradient></defs><ellipse cx="100" cy="110" rx="72" ry="30" fill="url(#rcg)" opacity="0.9"/><circle cx="65" cy="98" r="40" fill="url(#rcg)"/><circle cx="105" cy="88" r="48" fill="url(#rcg)"/><circle cx="143" cy="100" r="34" fill="url(#rcg)"/>${dsvg}</svg>`;
  }
  // Nieve
  if ([1066,1069,1072,1114,1117,1204,1207,1210,1213,1216,1219,1222,1225,1237,1249,1252,1255,1258,1261,1264].includes(condCode)) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ncg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d0e8f8"/><stop offset="100%" stop-color="#a0c8e8"/></linearGradient></defs><ellipse cx="100" cy="100" rx="72" ry="30" fill="url(#ncg)"/><circle cx="65" cy="88" r="40" fill="url(#ncg)"/><circle cx="105" cy="78" r="48" fill="url(#ncg)"/><circle cx="143" cy="90" r="34" fill="url(#ncg)"/>${[40,80,120,160,60,100,140].map((x,i)=>`<text x="${x}" y="${135+i%3*18}" font-size="22" fill="white" opacity="0.9" text-anchor="middle">❄</text>`).join('')}</svg>`;
  // Tormenta
  if ([1087,1273,1276,1279,1282].includes(condCode)) return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5a5a7a"/><stop offset="100%" stop-color="#2a2a4a"/></linearGradient></defs><ellipse cx="100" cy="100" rx="72" ry="30" fill="url(#stg)"/><circle cx="65" cy="88" r="40" fill="url(#stg)"/><circle cx="105" cy="78" r="48" fill="url(#stg)"/><circle cx="143" cy="90" r="34" fill="url(#stg)"/><polygon points="108,120 88,155 102,150 92,185 120,145 104,150" fill="#ffe040"/></svg>`;
  // Default nublado
  return `<svg width="${s}" height="${s}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="dcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c0d8f0"/><stop offset="100%" stop-color="#90b8d8"/></linearGradient></defs><ellipse cx="100" cy="120" rx="72" ry="30" fill="url(#dcg)"/><circle cx="65" cy="108" r="40" fill="url(#dcg)"/><circle cx="105" cy="98" r="48" fill="url(#dcg)"/><circle cx="143" cy="110" r="34" fill="url(#dcg)"/></svg>`;
}

function renderClima(data) {
  try {
    const current = data.current;
    const forecast = data.forecast.forecastday;

    let html = '<div style="display:flex;align-items:center;justify-content:center;flex:1;gap:40px;padding:40px 80px;">';

    forecast.forEach((day, i) => {
      const isToday = i === 0;
      const isTomorrow = i === 1;
      const d = new Date(day.date + 'T12:00:00');
      const label = isToday ? 'Hoy' : isTomorrow ? 'Mañana' : DIAS[d.getDay()];
      const numDia = d.getDate();
      const mes = MESES[d.getMonth()];

      const condCode = isToday ? current.condition.code : day.day.condition.code;
      const isDay = isToday ? current.is_day : 1;
      const max = Math.round(day.day.maxtemp_c);
      const min = Math.round(day.day.mintemp_c);
      const precip = Math.round(day.day.daily_chance_of_rain);
      const viento = Math.round(day.day.maxwind_kph);
      const hum = isToday ? current.humidity : day.day.avghumidity;
      const temp_actual = Math.round(current.temp_c);
      const sens = Math.round(current.feelslike_c);

      const tempHTML = isToday
        ? `<div class="today-temp-big">${temp_actual}<sup>°</sup></div>
           <div class="today-maxmin-iphone">Máxima: ${max}°&nbsp;&nbsp; Mínima: ${min}°</div>`
        : `<div class="card-temps"><span class="card-max">Máx ${max}°</span></div><div class="card-temps"><span class="card-min">Mín ${min}°</span></div>`;

      const extraHTML = isToday
        ? `<div class="today-extra">Vientos ${Math.round(current.wind_kph)} km/h &nbsp;·&nbsp; Humedad ${hum}%<br>Sensación térmica ${sens}°C &nbsp;·&nbsp; Lluvia ${precip}%</div>`
        : `<div class="card-extra"><strong>${day.day.condition.text}</strong><br>Vientos ${viento} km/h<br>Prob. lluvias ${precip}%</div>`;

      const iconBlock = isToday
        ? `<div class="card-icon">${getIcon(condCode, isDay, 240)}</div>
           <div class="today-desc-iphone">${current.condition.text}</div>`
        : `<div class="card-icon">${getIcon(condCode, isDay, 200)}</div>`;

      html += `<div class="card${isToday?' today':''}">
        <div class="card-fecha"><div class="card-dia-nombre">${label} ${numDia}<span>| ${mes}</span></div></div>
        ${iconBlock}
        <div class="card-divider"></div>
        ${tempHTML}
        ${extraHTML}
        <div class="card-lluvia">${GOTA}<span class="card-lluvia-pct">${precip}%</span></div>
      </div>`;
    });

    html += '</div>';
    document.getElementById('clima-body').innerHTML = html;

  } catch(e) {
    console.error('Error render:', e);
  }
}

// Cache en localStorage para no llamar a la API en cada recarga de Doohmain
// Solo llama a la API si pasaron más de 30 minutos desde la última consulta
async function loadClimaConCache() {
  const CACHE_KEY = 'clima_cache';
  const CACHE_TIME = 'clima_cache_time';
  const INTERVALO = 30 * 60 * 1000; // 30 minutos en ms

  const ahora = Date.now();
  const ultimaConsulta = parseInt(localStorage.getItem(CACHE_TIME) || '0');
  const cacheData = localStorage.getItem(CACHE_KEY);

  // Si hay cache y no pasaron 30 minutos, usar cache
  if (cacheData && (ahora - ultimaConsulta) < INTERVALO) {
    console.log('Usando cache del clima — próxima actualización en', Math.round((INTERVALO - (ahora - ultimaConsulta)) / 60000), 'minutos');
    renderClima(JSON.parse(cacheData));
    return;
  }

  // Si no hay cache o pasaron 30 minutos, llamar a la API
  try {
    const url = `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${encodeURIComponent(CIUDAD_Q)}&days=3&lang=es`;
    const resp = await fetch(url);
    const data = await resp.json();
    // Guardar en cache
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_TIME, ahora.toString());
    console.log('API consultada — próxima en 30 minutos');
    renderClima(data);
  } catch(e) {
    // Si falla la API pero hay cache vieja, usarla igual
    if (cacheData) {
      console.log('Error API, usando cache anterior');
      renderClima(JSON.parse(cacheData));
    } else {
      console.error('Error:', e);
      document.getElementById('clima-body').innerHTML = `<div style="color:rgba(255,255,255,0.7);font-size:28px;text-align:center;width:100%;">Conectando...<br><span style="font-size:18px;opacity:0.5">${e.message}</span></div>`;
      setTimeout(loadClimaConCache, 15000);
    }
  }
}

loadClimaConCache();
// Revisar cada minuto si pasaron 30 minutos para actualizar
setInterval(loadClimaConCache, 60*1000);
</script>
</body>
</html>
